[package]
name = "dbm-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Signed self-updates for the native DBM preview apps."

[dependencies]
base64 = "0.22"
minisign-verify = "0.2"
# Patch updates (src/patch.rs): bsdiff, whose bzip2 streams are recompressed
# with xz, and SHA-256 hashes of every file.
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
qbsdiff = "1.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# Rebuilt AppImages: reading the installed image's squashfs and writing a new one.
[target.'cfg(target_os = "linux")'.dependencies]
backhand = { version = "0.25", default-features = false, features = ["zstd"] }

[dev-dependencies]
minisign = "0.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
