[package]
name = "dbm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono.workspace = true
directories.workspace = true
futures-util.workspace = true
mysql_async.workspace = true
native-tls.workspace = true
pem = "3"
percent-encoding.workspace = true
postgres-native-tls.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
keyring.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
redis_rs.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
native-tls = { workspace = true, features = ["vendored"] }
# redis-rs's native-tls connector cannot accept Android's exported CA bundle.
redis_rs = { package = "redis", version = "0.32", default-features = false, features = ["tokio-rustls-comp"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true
