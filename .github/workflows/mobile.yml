name: Mobile development builds

on:
  pull_request:
    paths: ['apps/native/android/**', 'apps/native/ios/**', 'apps/native/bridge/**', 'crates/dbm-core/**', 'Cargo.*', '.github/workflows/mobile*.yml', 'scripts/*mobile*', 'scripts/testflight-distribute.py', 'scripts/play-upload.py']
  push:
    branches: [main]
    paths: ['apps/native/android/**', 'apps/native/ios/**', 'apps/native/bridge/**', 'crates/dbm-core/**', 'Cargo.*', '.github/workflows/mobile*.yml', 'scripts/*mobile*', 'scripts/testflight-distribute.py', 'scripts/play-upload.py']
  workflow_dispatch:

# No signing secrets, releases, store uploads, or production/database access.
permissions:
  contents: read
# A new push to a pull request supersedes its in-flight run. On main (and manual
# runs) the running build always finishes and only the newest waiting run goes
# next (GitHub replaces older pending runs in the group), so nothing piles up.
concurrency:
  group: mobile-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle User Home (dependencies, wrapper distribution, build cache).
      # The open-source provider over actions/cache; it saves only from the
      # default branch and is read-only elsewhere.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,x86_64-linux-android
      # Rust dependencies plus ~/.cargo/bin, so the pinned cargo-ndk below is
      # found already installed instead of compiled from source.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - run: bash apps/native/android/build.sh
      - name: Check release packaging with a disposable signing key
        run: |
          set -euo pipefail
          export DBM_ANDROID_KEYSTORE="$RUNNER_TEMP/dbm-fixture.jks"
          export DBM_ANDROID_KEYSTORE_PASSWORD=fixture-only DBM_ANDROID_KEY_PASSWORD=fixture-only
          export DBM_ANDROID_KEY_ALIAS=fixture DBM_BUILD_NUMBER=703
          trap 'rm -f "$DBM_ANDROID_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$DBM_ANDROID_KEYSTORE" -storepass fixture-only \
            -keypass fixture-only -alias fixture -dname 'CN=Disposable CI fixture' \
            -keyalg RSA -keysize 2048 -validity 2 -storetype JKS
          apps/native/android/gradlew -p apps/native/android --no-daemon --max-workers=2 lintRelease assembleRelease bundleRelease
          apk=apps/native/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.dbm.nativeapp' versionCode='703'"
          jarsigner -verify apps/native/android/app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/dbm-fixture-verification.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/dbm-fixture-verification.txt"
          grep -q 'ALLOW_DEMO = false' apps/native/android/app/build/generated/source/buildConfig/release/com/dbm/nativeapp/BuildConfig.java
      - name: Record exact tested revision and checksums
        run: |
          mkdir -p dist/mobile/android
          cp apps/native/android/app/build/outputs/apk/debug/app-debug.apk dist/mobile/android/DBM-android-debug.apk
          printf '{"revision":"%s","developmentOnly":true,"debugSigned":true}\n' "$(git rev-parse HEAD)" > dist/mobile/android/BUILD.json
          (cd dist/mobile/android && sha256sum DBM-android-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: DBM-android-development-${{ github.sha }}
          path: dist/mobile/android/
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for GitHub-hosted native UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: apps/native/android/gradlew -p apps/native/android --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DBM-android-ui-${{ github.sha }}
          path: |
            apps/native/android/app/build/reports/
            apps/native/android/app/build/outputs/connected_android_test_additional_output/
          retention-days: 14

  iphone:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Provision the SDK-matched iPhone test simulator
        run: |
          sudo xcodebuild -runFirstLaunch
          # simctl waits for CoreSimulator's cache initialization; xcodebuild does not.
          xcrun simctl list
          version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${version//./-}"
          runtimes="$(xcrun simctl list runtimes --json)"
          if ! jq -e --arg runtime "$runtime" 'any(.runtimes[]; .identifier == $runtime and .isAvailable)' <<< "$runtimes" > /dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion "$version"
            xcrun simctl list
          fi
          device="$(xcrun simctl create 'DBM UI Tests' com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")"
          # Boot in the background while the app builds; the wait for a
          # finished boot happens right before the UI tests.
          xcrun simctl boot "$device"
          echo "DBM_IOS_SIMULATOR_ID=$device" >> "$GITHUB_ENV"
          echo "DBM_IOS_TEST_DESTINATION=platform=iOS Simulator,id=$device" >> "$GITHUB_ENV"
      # build.sh compiles XcodeGen from source at a pinned commit; reuse that
      # build. Keyed by the commit and the Xcode version, and still checked
      # out and verified against the commit by build.sh.
      - name: Identify the XcodeGen build
        id: xcodegen
        run: |
          commit="$(sed -n 's/^XCODEGEN_COMMIT=//p' apps/native/ios/build.sh)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | tr -s '\n ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: xcodegen-cache
        with:
          path: apps/native/ios/.build/xcodegen-${{ steps.xcodegen.outputs.commit }}
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcodegen.outputs.commit }}-${{ steps.xcodegen.outputs.xcode }}
      - run: bash apps/native/ios/build.sh simulator
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.xcodegen-cache.outputs.cache-hit != 'true'
        with:
          path: apps/native/ios/.build/xcodegen-${{ steps.xcodegen.outputs.commit }}
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcodegen.outputs.commit }}-${{ steps.xcodegen.outputs.xcode }}
      - name: Record simulator-only package, exact revision and checksums
        run: |
          mkdir -p dist/mobile/ios
          ditto -c -k --keepParent apps/native/ios/DerivedData/Build/Products/Debug-iphonesimulator/DBM.app dist/mobile/ios/DBM-ios-simulator-arm64.zip
          printf '{"revision":"%s","developmentOnly":true,"simulatorOnly":true}\n' "$(git rev-parse HEAD)" > dist/mobile/ios/BUILD.json
          (cd dist/mobile/ios && shasum -a 256 DBM-ios-simulator-arm64.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: DBM-iphone-simulator-development-${{ github.sha }}
          path: dist/mobile/ios/
          if-no-files-found: error
          retention-days: 14
      - name: Wait for the test simulator to finish booting
        run: xcrun simctl bootstatus "$DBM_IOS_SIMULATOR_ID" -b
      - run: bash apps/native/ios/build.sh test
      - name: Check the Release device archive without signing or uploading
        run: |
          bash apps/native/ios/prepare.sh iphoneos
          xcodebuild -project apps/native/ios/DBM.xcodeproj -scheme DBM -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/DBM-unsigned.xcarchive" \
            -derivedDataPath apps/native/ios/DerivedData-Release \
            DBM_IOS_BUNDLE_ID=app.dbm.ios CODE_SIGNING_ALLOWED=NO archive
      - name: Export native UI screenshots for review
        if: always()
        run: |
          if [[ -d apps/native/ios/DerivedData-Tests/DBM.xcresult ]]; then
            xcrun xcresulttool export attachments --path apps/native/ios/DerivedData-Tests/DBM.xcresult --output-path dist/mobile/ios-ui
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DBM-iphone-ui-${{ github.sha }}
          path: |
            apps/native/ios/DerivedData-Tests/DBM.xcresult
            dist/mobile/ios-ui/
          retention-days: 14
