name: Mobile release on main

# When a push to main passes Mobile development builds, release that exact
# commit to TestFlight and Google Play internal testing. Nobody clicks anything:
# main is production. mobile-release.yml runs one release at a time, and GitHub
# keeps only the newest waiting one, which includes everything before it.
on:
  workflow_run:
    workflows: [Mobile development builds]
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  release:
    name: Release the mobile apps
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch mobile-release.yml for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run mobile-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f git_sha="$GIT_SHA"
          echo "Releasing mobile apps for $GIT_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/mobile-release.yml" \
            | tee -a "$GITHUB_STEP_SUMMARY"
