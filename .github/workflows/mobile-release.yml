name: Mobile release

# Signs and uploads the mobile apps for one tested main commit. mobile-ready.yml
# starts it after Mobile development builds pass on a push; separate from the
# automatic desktop updater.
on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main commit to release (blank uses newest main).
        type: string
        default: ""

permissions:
  contents: read
concurrency:
  group: dbm-mobile-release
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  RELEASE_SIGNER_ROLE: arn:aws:iam::395451633568:role/production-dbm-release-signer
  DBM_IOS_BUNDLE_ID: se.anyba.app

jobs:
  resolve:
    name: Resolve tested main commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      build: ${{ steps.version.outputs.build }}
      ios_notes: ${{ steps.notes.outputs.ios_notes }}
      android_notes: ${{ steps.notes.outputs.android_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "git_sha must be a full lowercase SHA." >&2; exit 1; }
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo "Commit is not on main." >&2; exit 1; }
          # Mobile development builds only run when mobile files change (these
          # paths match mobile.yml's push filter), so a later commit that changes
          # none of them is releasable from the newest passing build before it.
          mobile_paths=(':(glob)apps/native/android/**' ':(glob)apps/native/ios/**' ':(glob)apps/native/bridge/**'
            ':(glob)crates/dbm-core/**' ':(glob)Cargo.*' ':(glob).github/workflows/mobile*.yml'
            ':(glob)scripts/*mobile*' ':(glob)scripts/testflight-distribute.py*' ':(glob)scripts/play-upload.py*')
          tested=""
          for candidate in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mobile.yml/runs?branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[].head_sha'); do
            git merge-base --is-ancestor "$candidate" "$sha" || continue
            if git diff --quiet "$candidate" "$sha" -- "${mobile_paths[@]}"; then tested="$candidate"; break; fi
          done
          [[ -n "$tested" ]] || { echo "Mobile files at this commit need passing Mobile development builds on main before release." >&2; exit 1; }
          [[ "$tested" == "$sha" ]] || echo "Mobile files are unchanged since $tested, which passed Mobile development builds."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: version
        name: Number the release
        # CalVer like the desktop apps, e.g. 2026.11.22.3, iOS app version
        # 2026.11.2203, build 2026112203. A re-run keeps its version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mobile_release_version.py
      - name: Write each app's release notes
        id: notes
        env:
          DBM_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        # Each store lists only the commits that ship in its app since the
        # commit mobile-latest names; this workflow's scripts write them.
        run: |
          set -euo pipefail
          PREVIOUS_MOBILE_SHA="$(gh release view mobile-latest --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
            | grep -oE '[0-9a-f]{40}' | head -1 || true)" node scripts/release.mjs mobile-notes

  android:
    name: Android / signed APK and Play bundle
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DBM_BUILD_NUMBER: ${{ needs.resolve.outputs.build }}
      DBM_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # The selected commit can predate uv metadata/locks. Keep its application
      # and upload code, but install locked dependencies from this workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
      - name: Prepare locked distribution environment
        run: |
          set -euo pipefail
          uv export --locked --script .release-tooling/scripts/play-upload.py --output-file "$RUNNER_TEMP/mobile-requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/mobile-python"
          uv pip sync --python "$RUNNER_TEMP/mobile-python/bin/python" --require-hashes "$RUNNER_TEMP/mobile-requirements.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.RELEASE_SIGNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load the existing upload key
        run: |
          set -euo pipefail
          umask 077
          secret="$RUNNER_TEMP/android.json"
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -e '.android | objects' > "$secret"
          jq -e 'all(.keystore_base64, .keystore_password, .key_alias, .key_password; type == "string" and length > 0)' "$secret" > /dev/null
          for key in keystore_password key_password; do
            echo "::add-mask::$(jq -r ".$key" "$secret")"
          done
          jq -r .keystore_base64 "$secret" | base64 --decode > "$RUNNER_TEMP/dbm-release.jks"
          {
            echo "DBM_ANDROID_KEYSTORE=$RUNNER_TEMP/dbm-release.jks"
            echo "DBM_ANDROID_KEYSTORE_PASSWORD=$(jq -r .keystore_password "$secret")"
            echo "DBM_ANDROID_KEY_ALIAS=$(jq -r .key_alias "$secret")"
            echo "DBM_ANDROID_KEY_PASSWORD=$(jq -r .key_password "$secret")"
          } >> "$GITHUB_ENV"
          rm -f "$secret"
      - name: Build and verify the signed packages
        run: |
          set -euo pipefail
          bash apps/native/android/build.sh lintRelease assembleRelease bundleRelease
          apk=apps/native/android/app/build/outputs/apk/release/app-release.apk
          aab=apps/native/android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/bundle-verification.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/bundle-verification.txt"
          unzip -l "$apk" | grep 'lib/arm64-v8a/libdbm_android.so'
          unzip -l "$apk" | grep 'lib/x86_64/libdbm_android.so'
          unzip -l "$apk" | grep 'assets/SpaceMono-LICENSE.txt'
          mkdir -p dist/mobile/release dist/mobile/play
          cp "$apk" dist/mobile/release/DBM-Android.apk
          cp "$aab" dist/mobile/play/DBM-Android-Play.aab
          printf '{"revision":"%s","versionCode":%s,"releaseSigned":true}\n' "$(git rev-parse HEAD)" "$DBM_BUILD_NUMBER" > dist/mobile/release/BUILD.json
          (cd dist/mobile/release && sha256sum DBM-Android.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-release-android
          path: dist/mobile/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle
          path: dist/mobile/play/DBM-Android-Play.aab
          if-no-files-found: error
          retention-days: 30
      - name: Roll out to Google Play internal and closed testers
        env:
          ANDROID_NOTES: ${{ needs.resolve.outputs.android_notes }}
          # internal: Friends & Family, immediately. alpha: the public beta
          # (members of anybase-testers@googlegroups.com), after Google's review.
          PLAY_TRACK: internal,alpha
        run: |
          set -euo pipefail
          umask 077
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -er '.dbm_google_play.service_account_json | strings' > "$RUNNER_TEMP/play.json"
          export GOOGLE_PLAY_SERVICE_ACCOUNT="$RUNNER_TEMP/play.json"
          export PLAY_RELEASE_NAME="$DBM_VERSION"
          export PLAY_RELEASE_NOTES="$ANDROID_NOTES"
          "$RUNNER_TEMP/mobile-python/bin/python" scripts/play-upload.py dist/mobile/play/DBM-Android-Play.aab
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dbm-release.jks" "$RUNNER_TEMP/android.json" "$RUNNER_TEMP/play.json"

  testflight:
    name: iPhone / TestFlight
    needs: resolve
    # GitHub's Xcode 27 image (public preview) carries the iOS 27.1 SDK that
    # lets iPhone Duo run the app edge to edge instead of in a centred window.
    runs-on: xcode-27
    timeout-minutes: 110
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_NUMBER: ${{ needs.resolve.outputs.build }}.${{ github.run_attempt }}
      DBM_APP_VERSION: ${{ needs.resolve.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-ios
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
      - name: Prepare locked distribution environment
        run: |
          set -euo pipefail
          uv export --locked --script .release-tooling/scripts/testflight-distribute.py --output-file "$RUNNER_TEMP/mobile-requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/mobile-python"
          uv pip sync --python "$RUNNER_TEMP/mobile-python/bin/python" --require-hashes "$RUNNER_TEMP/mobile-requirements.txt"
      - name: Use Xcode 27.1 (iOS 27.1 SDK for the full iPhone Duo display)
        run: |
          set -euo pipefail
          xcode=/Applications/Xcode_27.1.app
          [[ -d "$xcode" ]] || { echo "Xcode 27.1 is required:" >&2; ls -d /Applications/Xcode* >&2; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.RELEASE_SIGNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load the existing App Store Connect API key
        run: |
          set -euo pipefail
          umask 077
          secret="$RUNNER_TEMP/apple.json"
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -e '.apple | objects' > "$secret"
          jq -e 'all(.app_store_connect_private_key, .app_store_connect_key_id, .app_store_connect_issuer_id, .team_id; type == "string" and length > 0)' "$secret" > /dev/null
          jq -r .app_store_connect_private_key "$secret" > "$RUNNER_TEMP/asc.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/asc.p8"
            echo "NOTARY_KEY_ID=$(jq -r .app_store_connect_key_id "$secret")"
            echo "NOTARY_ISSUER=$(jq -r .app_store_connect_issuer_id "$secret")"
            echo "APPLE_TEAM_ID=$(jq -r .team_id "$secret")"
          } >> "$GITHUB_ENV"
          rm -f "$secret"
      - name: Archive and upload
        run: bash apps/native/ios/upload-testflight.sh
      - name: Wait for processing and assign tester groups
        env:
          IOS_NOTES: ${{ needs.resolve.outputs.ios_notes }}
        run: |
          set -euo pipefail
          export WHAT_TO_TEST="$IOS_NOTES"
          "$RUNNER_TEMP/mobile-python/bin/python" scripts/testflight-distribute.py
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/apple.json"

  publish:
    name: Update the Android download
    needs: [resolve, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-release-android
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # A prerelease is never the desktop updaters' releases/latest target.
          if gh release view mobile-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete mobile-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          # The tag goes on main's head as it is now, not as it was when this run
          # started: GITHUB_TOKEN may not create a tag on an older commit whose
          # workflow files differ from main (HTTP 403). The notes and BUILD.json
          # name the released commit.
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          gh release create mobile-latest --repo "$GITHUB_REPOSITORY" --target "$head" \
            --prerelease --latest=false --title 'Anybase mobile (latest)' \
            --notes "Signed Android build from $RELEASE_SHA. Install and update through Google Play internal testing: https://play.google.com/apps/testing/se.anyba.app (tester enrollment required). If the Play upload was saved as a draft, roll it out in Play Console first. The APK below is an alternative download, not the Play install. iPhone delivery runs separately through TestFlight; check this run's iPhone job for its result. Native clients remain read-only and require verified TLS. Desktop downloads and updates are unchanged." \
            release/DBM-Android.apk release/BUILD.json release/SHA256SUMS
