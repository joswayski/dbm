name: Release

# Every merge to main that touches the app builds the native apps (AppKit on
# macOS, Win32 on Windows, GTK 4 on Linux), signs them, and publishes them as the
# latest GitHub release. Installed copies read two manifests from
# releases/latest/download and update in place:
#
#   native-latest.json  the native apps' own updater (crates/dbm-update)
#   latest.json         installs of the former Tauri app, whose updater swaps
#                       in DBM.app.tar.gz, the Windows setup, or the AppImage
#
# Every updater artifact is signed with the release updater key
# (tools/dbm-sign); both updaters verify it before installing anything.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".amp/**"
      - "apps/web/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/mobile*.yml"
      - "scripts/*mobile*"
      - "scripts/testflight-distribute.py*"
      - "scripts/play-upload.py*"
      - ".github/workflows/mac-runner-fallback.yml"
  workflow_dispatch:

# One release at a time. A newer merge waits instead of cancelling a release
# that may already have pushed its tag.
concurrency:
  group: dbm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Tag and draft the release
    # Manual runs from other branches must not publish a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      display_version: ${{ steps.version.outputs.display_version }}
      app_version: ${{ steps.version.outputs.app_version }}
      build: ${{ steps.build.outputs.build }}
      notes: ${{ steps.highlights.outputs.notes || steps.notes.outputs.notes }}
      releases: ${{ steps.highlights.outputs.releases }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Choose the next version
        id: version
        env:
          DBM_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release.mjs version
      - name: Derive the build number
        id: build
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          # 2026.9.2802 -> 2026092802: increases with every release, and is
          # far above the preview channel's run numbers.
          IFS=. read -r year month patch <<<"$APP_VERSION"
          printf 'build=%d%02d%04d\n' "$year" "$month" "$patch" >> "$GITHUB_OUTPUT"
      - name: Collect release notes
        id: notes
        env:
          DBM_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release.mjs notes
      - name: Load the previous release's highlights
        if: steps.notes.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.notes.outputs.previous_tag }}
        # Releases from before highlights existed have no history to carry on.
        run: |
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern native-latest.json --dir "$RUNNER_TEMP/previous" || true
      - name: Write user-facing highlights
        id: highlights
        # Missing credentials or an unavailable editorial service keep the
        # commit-based notes; they never stop a release.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty variables fall back to the generator defaults (Opus 5.5, high effort).
          ANTHROPIC_MODEL: ${{ vars.DBM_RELEASE_NOTES_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.DBM_RELEASE_NOTES_EFFORT }}
          DBM_RELEASE_SHA: ${{ github.sha }}
          PREVIOUS_TAG: ${{ steps.notes.outputs.previous_tag }}
          PREVIOUS_MANIFEST: ${{ runner.temp }}/previous/native-latest.json
          BUILD: ${{ steps.build.outputs.build }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: node scripts/release.mjs highlights
      - name: Push the tag and create a draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          NOTES: ${{ steps.highlights.outputs.body || steps.notes.outputs.notes }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/${TAG}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$NOTES" > "$notes_file"
          release_id="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$RELEASE_SHA" \
              -f name="Anybase $DISPLAY_VERSION" \
              -F body=@"$notes_file" \
              -F draft=true \
              --jq .id
          )"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  macos:
    name: Build, sign, and notarize (macOS)
    needs: prepare
    environment: release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DBM_NATIVE_BUILD: ${{ needs.prepare.outputs.build }}
      DBM_NATIVE_VERSION: ${{ needs.prepare.outputs.display_version }}
      DBM_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DBM_UPDATE_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      DBM_UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Restores the dependency cache CI's AppKit job saves from main (same
      # universal bridge build). Workspace crates, which compile in the version
      # and build number, are never cached and always rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: appkit-universal
          save-if: false
      - name: Prepare Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY \
                      DBM_UPDATE_SIGNING_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release environment secret: $name" >&2
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/dbm-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          keychain="$RUNNER_TEMP/dbm-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate_path" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain"
          identity="$(
            security find-identity -v -p codesigning "$keychain" \
              | awk -F\" '/Developer ID Application/{print $2; exit}'
          )"
          if [[ -z "$identity" ]]; then
            echo "The imported certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          {
            printf 'DBM_SIGNING_IDENTITY=%s\n' "$identity"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER"
            printf 'APPLE_API_KEY=%s\n' "$APPLE_API_KEY"
            printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path"
          } >> "$GITHUB_ENV"
      - name: Build and sign Anybase.app (Apple Silicon and Intel)
        env:
          DBM_UNIVERSAL: 1
        run: |
          bash apps/native/macos/build.sh
          lipo -archs target/native/Anybase.app/Contents/MacOS/dbm | grep -qw x86_64
          lipo -archs target/native/Anybase.app/Contents/MacOS/dbm | grep -qw arm64
      - name: Notarize and staple the app, then package it
        shell: bash
        run: |
          set -euo pipefail
          app="target/native/Anybase.app"
          out="target/native/release"
          mkdir -p "$out"
          notarize() {
            xcrun notarytool submit "$1" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" --wait
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple -v "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

          # The native updater's archive (it installs whichever .app it holds
          # at the existing install's path), and the one the Tauri updater
          # extracts over an installed DBM.app. That tarball keeps its DBM.app
          # folder name, exactly as those installs expect.
          ditto -c -k --keepParent "$app" "$out/DBM-macOS.zip"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -s '|^Anybase\.app|DBM.app|' \
            -C target/native -czf "$out/DBM.app.tar.gz" Anybase.app
          outside="$(tar -tzf "$out/DBM.app.tar.gz" | grep -cv '^DBM\.app/' || true)"
          [[ "$outside" == 0 ]] || { echo "DBM.app.tar.gz has entries outside DBM.app/" >&2; exit 1; }

          # A drag-to-Applications disk image for first installs.
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Anybase" -srcfolder "$staging" -ov \
            -format UDZO "$out/DBM-macOS.dmg"
          codesign --force --timestamp --sign "$DBM_SIGNING_IDENTITY" "$out/DBM-macOS.dmg"
          notarize "$out/DBM-macOS.dmg"
          xcrun stapler staple -v "$out/DBM-macOS.dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$out/DBM-macOS.dmg"
      - name: Write the bundle tar that patch updates rebuild
        shell: bash
        run: |
          set -euo pipefail
          # Installed copies rebuild this exact file from their own bundle
          # (crates/dbm-update/src/patch.rs). It must unpack into an app that
          # passes the same check the updater runs before swapping it in.
          cargo build --locked --release -p dbm-delta
          tar_file="target/native/release/DBM-macOS.app.tar"
          target/release/dbm-delta bundle target/native/Anybase.app "$tar_file"
          check="$RUNNER_TEMP/bundle-check"
          rm -rf "$check" && mkdir -p "$check"
          tar -xf "$tar_file" -C "$check"
          codesign --verify --deep --strict --verbose=2 "$check/Anybase.app"
          xcrun stapler validate "$check/Anybase.app"
      - name: Sign the updater archives with the release key
        run: |
          cargo build --locked --release -p dbm-sign
          target/release/dbm-sign target/native/release/DBM-macOS.zip target/native/release/DBM.app.tar.gz \
            target/native/release/DBM-macOS.app.tar
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: target/native/release/*
          if-no-files-found: error

  workbench:
    name: Build and sign (${{ matrix.os }})
    needs: prepare
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          # Windows ships the native Win32 app and Linux the GTK 4 app, both
          # under the egui app's former asset names so installs update onto them.
          - os: windows-2025
            app: apps/native/win32
            binary: dbm-win32.exe
            asset: DBM-Windows-x64.exe
            signer: target/release/dbm-sign.exe
          - os: ubuntu-24.04
            app: apps/native/gtk
            binary: dbm-gtk
            asset: DBM-Linux-x64
            signer: target/release/dbm-sign
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DBM_NATIVE_BUILD: ${{ needs.prepare.outputs.build }}
      DBM_NATIVE_VERSION: ${{ needs.prepare.outputs.display_version }}
      DBM_UPDATE_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      DBM_UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libgtk-4-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      # Third-party dependencies are reused. dbm-core and dbm-update still
      # rebuild: a fresh checkout's sources are newer than any cached output,
      # and Cargo tracks the DBM_NATIVE_* values they compile in. This workflow
      # runs only on main, so it reads and writes main's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ matrix.app }} -> target
            . -> target
      - run: cargo build --manifest-path ${{ matrix.app }}/Cargo.toml --locked --release
      - run: cargo build --locked --release -p dbm-sign
      - name: Stage and sign the executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "${{ matrix.app }}/target/release/${{ matrix.binary }}" "release/${{ matrix.asset }}"
          "${{ matrix.signer }}" "release/${{ matrix.asset }}"
      - name: Package and sign the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" bash apps/native/gtk/appimage.sh \
            "${{ matrix.app }}/target/release/${{ matrix.binary }}" release/DBM-Linux-x86_64.AppImage
          "${{ matrix.signer }}" release/DBM-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  windows-installer:
    name: Package the Windows installer
    needs: [prepare, workbench]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DBM_UPDATE_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      DBM_UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-Windows
          path: windows
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Build and sign DBM-Windows-x64-setup.exe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p release
          makensis -V2 \
            -DVERSION="$APP_VERSION" \
            -DEXE="$PWD/windows/DBM-Windows-x64.exe" \
            -DICON="$PWD/apps/native/icons/icon.ico" \
            -DOUTFILE="$PWD/release/DBM-Windows-x64-setup.exe" \
            apps/native/windows/installer.nsi
          cargo build --locked --release -p dbm-sign
          target/release/dbm-sign release/DBM-Windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: release/*
          if-no-files-found: error

  publish:
    name: Validate and publish
    needs: [prepare, macos, workbench, windows-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DISPLAY_VERSION: ${{ needs.prepare.outputs.display_version }}
      BUILD: ${{ needs.prepare.outputs.build }}
      NOTES: ${{ needs.prepare.outputs.notes }}
      RELEASES: ${{ needs.prepare.outputs.releases }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      # Patch updates (docs/releases.md#patch-updates): a bsdiff patch from
      # each of the five newest releases to this one, for every file an
      # installed copy can rebuild. Without them apps download whole files,
      # so this step never fails the release.
      - name: Build patch updates from earlier releases
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patches && mkdir -p patches
          cargo build --locked --release -p dbm-delta
          files=(DBM-macOS.app.tar DBM-Windows-x64.exe DBM-Linux-x64 DBM-Linux-x86_64.AppImage)
          patterns=(--pattern native-latest.json)
          for file in "${files[@]}"; do patterns+=(--pattern "$file"); done
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 5 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/bases.txt"
          while read -r tag; do
            dir="$RUNNER_TEMP/bases/$tag"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" "${patterns[@]}" || continue
            from="$(jq -er .build "$dir/native-latest.json")" || continue
            (( from < BUILD )) || continue
            for file in "${files[@]}"; do
              [[ -f "$dir/$file" && -f "assets/$file" ]] || continue
              out="patches/$file-$from-to-$BUILD.patch"
              target/release/dbm-delta diff "$dir/$file" "assets/$file" "$out" || continue
              # A patch over half the full file is not worth it.
              if (( $(stat -c %s "$out") * 2 > $(stat -c %s "assets/$file") )); then
                echo "Dropped $out: over half of $file"
                rm "$out"
              fi
            done
            rm -rf "$dir"
          done < "$RUNNER_TEMP/bases.txt"
          ls -l patches
      - name: Write the updater manifests
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sig() { tr -d '\n' < "assets/$1.sig"; }
          # The patches that rebuild release file $1, newest base first.
          patches_for() {
            local file from
            for file in patches/"$1"-*-to-"$BUILD".patch; do
              [[ -f "$file" ]] || continue
              from="${file#patches/$1-}"
              from="${from%-to-$BUILD.patch}"
              jq -n --argjson from "$from" --arg url "$base/${file#patches/}" \
                --argjson size "$(stat -c %s "$file")" --arg target "$1" --arg signature "$(sig "$1")" \
                '{fromBuild: $from, url: $url, size: $size, target: $target, signature: $signature}'
            done | jq -s 'sort_by(-.fromBuild)'
          }
          # $1 is the full download; $2, when given, the file its patches
          # rebuild (macOS rebuilds the bundle tar, not the zip).
          artifact() {
            jq -n --arg url "$base/$1" --arg signature "$(sig "$1")" --argjson patches "$(patches_for "${2:-$1}")" \
              '{url: $url, signature: $signature} + (if ($patches | length) > 0 then {patches: $patches} else {} end)'
          }
          mac_zip="$(artifact DBM-macOS.zip DBM-macOS.app.tar)"
          mac_tar="$(artifact DBM.app.tar.gz)"
          windows_exe="$(artifact DBM-Windows-x64.exe)"
          windows_setup="$(artifact DBM-Windows-x64-setup.exe)"
          linux_bin="$(artifact DBM-Linux-x64)"
          appimage="$(artifact DBM-Linux-x86_64.AppImage)"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # `releases` carries recent highlights (scripts/release.mjs), so
          # installed apps can show every release they skip and group What's
          # new by UTC day. This release's entry gets the publication time.
          jq -n \
            --argjson build "$BUILD" --arg version "$DISPLAY_VERSION" --arg notes "$NOTES" \
            --argjson mac "$mac_zip" --argjson windows "$windows_exe" \
            --argjson linux "$linux_bin" --argjson appimage "$appimage" \
            --argjson releases "${RELEASES:-[]}" --arg pub_date "$pub_date" \
            '{build: $build, version: $version, notes: $notes, platforms: {
                "darwin-aarch64": $mac, "darwin-x86_64": $mac,
                "windows-x86_64": $windows,
                "linux-x86_64": $linux, "linux-x86_64-appimage": $appimage},
              releases: ($releases | if length > 0 and .[0].build == $build
                then .[0].publishedAt = $pub_date else . end)}' \
            > native-latest.json

          # The Tauri updater's format. Its version must be newer than the
          # last Tauri release (2026.9.2801), which the CalVer tags ensure.
          jq -n \
            --arg version "$APP_VERSION" --arg notes "$NOTES" \
            --arg pub_date "$pub_date" \
            --argjson mac "$mac_tar" --argjson windows "$windows_setup" --argjson appimage "$appimage" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
                "darwin-aarch64": $mac, "darwin-x86_64": $mac,
                "darwin-aarch64-app": $mac, "darwin-x86_64-app": $mac,
                "windows-x86_64": $windows, "windows-x86_64-nsis": $windows,
                "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage}}' \
            > latest.json

          for manifest in native-latest.json latest.json; do
            jq -e '[.platforms[] | (.signature | length > 0) and (.url | length > 0)] | all' "$manifest" > /dev/null
            cat "$manifest"
          done
          cp native-latest.json latest.json assets/
          cp patches/*.patch assets/ 2>/dev/null || true
      - name: Add Anybase-named first-install downloads
        working-directory: assets
        run: |
          set -euo pipefail
          # Byte-identical copies for the website and README. The updaters keep
          # downloading the DBM-named files (docs/anybase-migration.md).
          cp DBM-macOS.dmg Anybase-macOS.dmg
          cp DBM-Windows-x64-setup.exe Anybase-Windows-x64-setup.exe
          cp DBM-Linux-x86_64.AppImage Anybase-Linux-x86_64.AppImage
      - name: Write checksums
        working-directory: assets
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          cp ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*
      - name: Upload the assets, then publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)" != "true" ]]; then
            echo "Release $TAG is no longer a draft; refusing to modify it." >&2
            exit 1
          fi
          # Manifests last, so nothing points at a file that is not up yet.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            $(ls assets/* | grep -v -e 'latest.json$')
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            assets/native-latest.json assets/latest.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name="$TAG" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            --silent
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
      - name: Move native preview installs onto releases
        shell: bash
        run: |
          set -euo pipefail
          # Copies from the old native-preview channel read its manifest; point
          # it here once so they update to a build that reads releases/latest.
          if gh release view native-preview --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload native-preview --repo "$GITHUB_REPOSITORY" --clobber assets/native-latest.json
          fi

  cleanup:
    name: Remove the unpublished draft
    needs: [prepare, macos, workbench, windows-installer, publish]
    if: (failure() || cancelled()) && needs.prepare.outputs.release_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Delete the draft and its tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)" != "true" ]]; then
            echo "Release $TAG was published; leaving it in place."
            exit 0
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
