name: CI

# Runs on main only; pull requests get no CI. Use "Run workflow" to test a branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# The running build always finishes and only the newest waiting push runs next (GitHub
# replaces older pending runs in the group), so fast pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/mac-route.yml
    secrets: inherit

  release-scripts:
    needs: route
    name: Release scripts
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run test:release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pyjwt[crypto]==2.10.1' 'PyYAML==6.0.3'
      - run: python3 -m unittest discover -s scripts -p test_mobile_release.py -v
      - name: Build the Windows installer from a stand-in executable
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          printf 'MZ' > "$RUNNER_TEMP/dbm.exe"
          makensis -V2 -DVERSION=0.0.0 -DEXE="$RUNNER_TEMP/dbm.exe" \
            -DICON="$PWD/apps/native/icons/icon.ico" \
            -DOUTFILE="$RUNNER_TEMP/DBM-setup.exe" apps/native/windows/installer.nsi
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  web:
    needs: route
    name: Website
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build (fetches Latest changes from GitHub)
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    needs: route
    runs-on: ${{ needs.route.outputs.mac == 'true' && matrix.os == 'macos-14' && fromJSON('["self-hosted","josemac"]') || needs.route.outputs.windows == 'true' && startsWith(matrix.os, 'windows') && fromJSON('["self-hosted","josewin"]') || needs.route.outputs.linux == 'true' && startsWith(matrix.os, 'ubuntu') && fromJSON('["self-hosted","joselinux"]') || matrix.os }}
    timeout-minutes: 30
    env:
      # CI-only: dev/test builds without debug info compile, link, and cache
      # faster. Release builds and their artifacts are unaffected.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config \
            redis-server
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      # Dependencies only (workspace crates always rebuild). Manual runs on
      # other branches restore main's cache but never save, so they cannot evict or poison it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # No separate `cargo check --workspace --all-targets`: the clippy step
      # below type-checks the same targets and fails on the same errors.
      - run: cargo test --workspace --all-targets
      - run: cargo test -p dbm-native-bridge --no-default-features
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  appkit:
    name: AppKit (macos-14)
    needs: route
    runs-on: ${{ needs.route.outputs.mac == 'true' && fromJSON('["self-hosted","josemac"]') || 'macos-14' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Shared with the release workflow's macOS job, which builds the same
      # universal bridge and restores this cache without saving its own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: appkit-universal
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Universal, like the release, so an Intel-only break fails here.
      - name: Build the AppKit app
        env:
          DBM_UNIVERSAL: 1
        run: bash apps/native/macos/build.sh
      - name: Archive the AppKit app
        run: ditto -c -k --keepParent target/native/Anybase.app target/native/DBM-macos.zip
      - name: Render isolated AppKit fixture states
        run: |
          mkdir -p target/native/snapshots
          python3 -c 'import subprocess; subprocess.run(["target/native/Anybase.app/Contents/MacOS/dbm", "--demo", "--snapshot-dir", "target/native/snapshots"], check=True, timeout=120)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DBM-macos-development
          path: |
            target/native/DBM-macos.zip
            target/native/snapshots
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  native-workbench:
    needs: route
    name: Native workbench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ needs.route.outputs.windows == 'true' && startsWith(matrix.os, 'windows') && fromJSON('["self-hosted","josewin"]') || needs.route.outputs.linux == 'true' && startsWith(matrix.os, 'ubuntu') && fromJSON('["self-hosted","joselinux"]') || matrix.os }}
    timeout-minutes: 30
    env:
      # CI-only, as in the Rust job; the release build below is unaffected.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/workbench -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path apps/native/workbench/Cargo.toml --all -- --check
      - run: cargo test --manifest-path apps/native/workbench/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/native/workbench/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path apps/native/workbench/Cargo.toml --locked --release
      - name: Archive Linux native development binary
        if: runner.os == 'Linux'
        run: tar -czf DBM-linux.tar.gz -C apps/native/workbench/target/release dbm-workbench
      - name: Archive Windows native development binary
        if: runner.os == 'Windows'
        run: Compress-Archive apps/native/workbench/target/release/dbm-workbench.exe DBM-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DBM-${{ runner.os }}-development
          path: DBM-*.*
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"
