name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its in-flight run. On main the running
# build always finishes and only the newest waiting push runs next (GitHub
# replaces older pending runs in the group), so fast pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/release.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pyjwt[crypto]==2.10.1' 'PyYAML==6.0.3'
      - run: python3 -m unittest discover -s scripts -p test_mobile_release.py -v
      - name: Build the Windows installer from a stand-in executable
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          printf 'MZ' > "$RUNNER_TEMP/dbm.exe"
          makensis -V2 -DVERSION=0.0.0 -DEXE="$RUNNER_TEMP/dbm.exe" \
            -DICON="$PWD/apps/native/icons/icon.ico" \
            -DOUTFILE="$RUNNER_TEMP/DBM-setup.exe" apps/native/windows/installer.nsi

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # CI-only: dev/test builds without debug info compile, link, and cache
      # faster. Release builds and their artifacts are unaffected.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config \
            redis-server
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      # Dependencies only (workspace crates always rebuild). Pull requests
      # restore main's cache but never save, so they cannot evict or poison it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # No separate `cargo check --workspace --all-targets`: the clippy step
      # below type-checks the same targets and fails on the same errors.
      - run: cargo test --workspace --all-targets
      - run: cargo test -p dbm-native-bridge --no-default-features
      - run: cargo clippy --workspace --all-targets -- -D warnings

  appkit:
    name: AppKit (macos-14)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Shared with the release workflow's macOS job, which builds the same
      # universal bridge and restores this cache without saving its own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: appkit-universal
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Universal, like the release, so an Intel-only break fails here.
      - name: Build the AppKit app
        env:
          DBM_UNIVERSAL: 1
        run: bash apps/native/macos/build.sh
      - name: Archive the AppKit app
        run: ditto -c -k --keepParent target/native/DBM.app target/native/DBM-macos.zip
      - name: Render isolated AppKit fixture states
        run: |
          mkdir -p target/native/snapshots
          python3 -c 'import subprocess; subprocess.run(["target/native/DBM.app/Contents/MacOS/dbm", "--demo", "--snapshot-dir", "target/native/snapshots"], check=True, timeout=120)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DBM-macos-development
          path: |
            target/native/DBM-macos.zip
            target/native/snapshots

  native-workbench:
    name: Native workbench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # CI-only, as in the Rust job; the release build below is unaffected.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/workbench -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path apps/native/workbench/Cargo.toml --all -- --check
      - run: cargo test --manifest-path apps/native/workbench/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/native/workbench/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path apps/native/workbench/Cargo.toml --locked --release
      - name: Archive Linux native development binary
        if: runner.os == 'Linux'
        run: tar -czf DBM-linux.tar.gz -C apps/native/workbench/target/release dbm-workbench
      - name: Archive Windows native development binary
        if: runner.os == 'Windows'
        run: Compress-Archive apps/native/workbench/target/release/dbm-workbench.exe DBM-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DBM-${{ runner.os }}-development
          path: DBM-*.*
