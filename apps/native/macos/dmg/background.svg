<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!--
    macOS DMG window background, drawn under Finder's real icons.
    Finder places Anybase.app at (170, 200) and the Applications link at
    (490, 200) as 128 pt icons with black labels below them (a background
    picture keeps Finder's icon view in light rendering, even in Dark Mode),
    so keep this art light and never draw the icons here. The bottom edge
    stays white because Finder fills any extra window height below the
    picture with white.
    Render background.png (660x400) and background@2x.png (1320x800) using
    the bundled Space Mono faces in apps/native/fonts/.
  -->
  <rect width="660" height="400" fill="#ffffff"/>
  <rect x="78.5" y="116.5" width="183" height="191" rx="20" fill="#f5f5f7" stroke="rgba(22, 22, 24, 0.08)" stroke-width="1"/>
  <rect x="398.5" y="116.5" width="183" height="191" rx="20" fill="#f5f7fb" stroke="rgba(59, 120, 199, 0.34)" stroke-width="1.25" stroke-dasharray="5 4"/>
  <g font-family="'Space Mono', monospace" text-anchor="middle">
    <text x="330" y="62" font-size="20" font-weight="700" letter-spacing="-0.4" fill="#161618">Install Anybase</text>
    <text x="330" y="90" font-size="12.5" font-weight="400" fill="#52525b">Drag Anybase onto the Applications folder.</text>
    <text x="330" y="356" font-size="11.5" font-weight="400" fill="#686873">Then open Anybase from Applications.</text>
  </g>
  <g fill="none" stroke="#3b78c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 200H372"/>
    <path d="M360 188L374 200L360 212"/>
  </g>
</svg>
