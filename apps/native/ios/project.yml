name: DBM
options:
  bundleIdPrefix: app.dbm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../bridge/include"
targets:
  DBM:
    type: application
    platform: iOS
    sources:
      - Sources/DBM
      - path: Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Configuration/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(DBM_IOS_BUNDLE_ID)
        PRODUCT_NAME: DBM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Configuration/DBM-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.build/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -ldbm_native_bridge -lz -lc++ -framework Security -framework CoreFoundation -framework SystemConfiguration"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  DBMTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/DBMTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DBM
  DBMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/DBMUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DBM
schemes:
  DBM:
    build:
      targets:
        DBM: all
        DBMTests: [test]
        DBMUITests: [test]
    test:
      targets: [DBMTests, DBMUITests]
